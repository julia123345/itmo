version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-coords
    environment:
      MYSQL_DATABASE: auth_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      retries: 10
      start_period: 40s
      timeout: 5s
    command: --default-authentication-plugin=mysql_native_password

  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile
    container_name: auth-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JWT_SECRET: "weblab4-super-secret-key-that-is-at-least-32-characters"
    ports:
      - "8081:8080"

  geometry-service:
    build:
      context: ./backend
      dockerfile: geometry-service/Dockerfile
    container_name: geometry-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      JWT_SECRET: "weblab4-super-secret-key-that-is-at-least-32-characters"
    ports:
      - "8082:8080"

  frontend:
    build: ./frontend
    container_name: frontend-app
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - geometry-service

volumes:
  mysql_data: